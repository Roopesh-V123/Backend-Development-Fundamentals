services:
  - type: web
    name: roopesh-lab-01
    runtime: node
    plan: free
    rootDir: lab-01
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: roopesh-lab-02
    runtime: node
    plan: free
    rootDir: lab-02
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: roopesh-lab-03
    runtime: node
    plan: free
    rootDir: lab-03
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
